name: push_manager
description: "Minimal push manager — APNs on iOS, FCM on Android. Native code only, no Flutter Firebase plugins (keeps iOS Firebase-free)."
version: 1.2.0

homepage: https://github.com/nexas105/ios_apn_manager-Dart-Flutter-
repository: https://github.com/nexas105/ios_apn_manager-Dart-Flutter-
issue_tracker: https://github.com/nexas105/ios_apn_manager-Dart-Flutter-/issues

environment:
  sdk: ^3.9.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^5.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: IosApnManagerPlugin
      android:
        package: app.erohub.push
        pluginClass: ErohubPushPlugin
